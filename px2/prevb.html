<!doctype html><html><body style="margin:0"><script src="pxr9_part.js"></script><script src="chars9.js"></script><script src="dragon10.js"></script><script src="bosses10.js"></script><script>
function sheetImg(rows,title){const Z=2,G=14,LH=34;let W=0,H=50;const lay=[];
  for(const rw of rows){const cw=rw.items.map(it=>it.c.width*Z),h=Math.max(...rw.items.map(it=>it.c.height*Z));lay.push([rw,H]);H+=h+LH+26;W=Math.max(W,cw.reduce((a,b)=>a+b+G,0)+20);}
  const c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');g.imageSmoothingEnabled=false;
  const bg=g.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#2a2234');bg.addColorStop(1,'#3e3446');g.fillStyle=bg;g.fillRect(0,0,W,H);
  g.fillStyle='#ffe27a';g.font='bold 22px monospace';g.fillText(title,10,30);
  for(const [rw,y0] of lay){g.fillStyle='#ffffff';g.font='bold 18px monospace';g.fillText(rw.name,10,y0+20);let x=10;const h=Math.max(...rw.items.map(it=>it.c.height*Z));
    for(const it of rw.items){const w=it.c.width*Z,ih=it.c.height*Z;g.fillStyle='rgba(0,0,0,.22)';g.fillRect(x,y0+LH,w,h);g.drawImage(it.c,x,y0+LH+h-ih,w,ih);g.fillStyle='#d8cce0';g.font='13px monospace';g.fillText(it.l,x+2,y0+LH+h+16);x+=w+G;}}
  return c.toDataURL();}
